<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hivemind</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z' fill='%2309090b' stroke='%23d4ff4f' stroke-width='1.8'/%3E%3Ccircle cx='12' cy='8.5' r='2' fill='%23d4ff4f'/%3E%3Ccircle cx='8.5' cy='14.5' r='2' fill='%23d4ff4f'/%3E%3Ccircle cx='15.5' cy='14.5' r='2' fill='%23d4ff4f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.51.5/dist/force-graph.min.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 8.5 8.5 14.5h7z" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <circle cx="12" cy="8.5" r="1.9" fill="currentColor"/><circle cx="8.5" cy="14.5" r="1.9" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1.9" fill="currentColor"/>
      </svg>
      <span class="brand-name">Hivemind</span>
    </div>
    <span class="slash">/</span>
    <div class="dropdown" id="teamSwitch">
      <button class="team-btn" id="teamBtn" aria-haspopup="listbox"><span id="teamName">…</span><i data-icon="chevron"></i></button>
      <div class="menu" id="teamMenu" role="listbox" hidden></div>
    </div>

    <button class="search-btn" id="openPalette">
      <i data-icon="search"></i><span>Search functions, people, tasks</span><kbd>⌘K</kbd>
    </button>

    <div class="top-right">
      <div class="top-stats" id="topStats"></div>
      <div class="live" id="live" title="Updates every 2 seconds"><span class="pulse"></span>Live</div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme"><i data-icon="moon"></i></button>
    </div>
  </header>

  <aside class="side left">
    <section class="block" id="conflictBlock">
      <div class="block-head"><h3>Conflicts</h3><span class="count" id="conflictCount">0</span></div>
      <div id="conflicts"></div>
    </section>
    <section class="block">
      <div class="block-head"><h3>Team</h3><span class="count" id="teamCount">0</span></div>
      <div id="devs" class="dev-list"></div>
    </section>
    <section class="block">
      <div class="block-head"><h3>Open tasks</h3><span class="count" id="taskCount">0</span></div>
      <div id="tasks"></div>
    </section>
    <section class="block">
      <div class="block-head">
        <h3>Hotspots</h3>
        <div class="seg small" id="hotspotMode">
          <button data-v="rank" class="on" title="PageRank: how much of the codebase depends on it">Core</button>
          <button data-v="between" title="Betweenness: how many call paths run through it">Chokepoints</button>
        </div>
      </div>
      <div id="hotspots"></div>
    </section>
  </aside>

  <main class="stage">
    <div id="canvas"></div>
    <div class="toolbar">
      <div class="seg" id="layers" title="Layers">
        <button data-layer="calls" class="on">Calls</button>
        <button data-layer="claims" class="on">Work</button>
        <button data-layer="memory" class="on">Memory</button>
        <button data-layer="tests" title="Show test functions">Tests</button>
      </div>
      <div class="seg" id="colorMode" title="Colour functions by">
        <button data-v="file" class="on">By file</button>
        <button data-v="risk">By risk</button>
      </div>
      <button class="tool-btn" id="pathBtn" title="Find how two functions connect (P)"><i data-icon="route"></i>Path</button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="zoom">
      <button id="zoomIn" title="Zoom in"><i data-icon="plus"></i></button>
      <button id="zoomOut" title="Zoom out"><i data-icon="minus"></i></button>
      <button id="zoomFit" title="Fit (F)"><i data-icon="fit"></i></button>
    </div>
    <div class="legend" id="legend"></div>
  </main>

  <aside class="side right">
    <nav class="tabs" id="tabs">
      <button data-tab="inspect" class="on">Inspect</button>
      <button data-tab="memory">Memory <span class="count" id="memCount"></span></button>
      <button data-tab="activity">Activity</button>
    </nav>
    <div class="tab-body" id="tab-inspect"></div>
    <div class="tab-body" id="tab-memory" hidden>
      <div class="mem-head">
        <div class="seg" id="memKind">
          <button data-v="decisions" class="on">Decisions</button>
          <button data-v="attempts">Attempts</button>
          <button data-v="conventions">Conventions</button>
        </div>
        <button class="btn primary sm" id="memAdd"><i data-icon="plus"></i>Add</button>
      </div>
      <div class="field-wrap"><i data-icon="search"></i><input id="memSearch" placeholder="Filter memory" autocomplete="off"></div>
      <div id="memList"></div>
    </div>
    <div class="tab-body" id="tab-activity" hidden>
      <div class="chips" id="feedFilter"></div>
      <div id="feed"></div>
    </div>
  </aside>
</div>

<div class="overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Command palette">
    <div class="palette-input"><i data-icon="search"></i><input id="paletteInput" placeholder="Type a function, person, task or command" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span></div>
  </div>
</div>

<div class="overlay" id="modal" hidden>
  <form class="modal" id="modalForm" autocomplete="off"></form>
</div>

<datalist id="fnList"></datalist>
<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
